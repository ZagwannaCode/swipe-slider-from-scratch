<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="swiper.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="swiper">
    <ul class="container">
      <li class="card"><div class="content">0</div></li>
      <li class="card"><div class="content">1</div></li>
      <li class="card"><div class="content">2</div></li>
      <li class="card"><div class="content">3</div></li>
      <li class="card"><div class="content">4</div></li>
      <li class="card"><div class="content">5</div></li>
      <li class="card"><div class="content">6</div></li>
    </ul>
    <button class="btn back">Back</button>
    <button class="btn forward">Forward</button>
  </div>
</body>
</html>
